x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  rsshub:
    image: diygod/rsshub:latest
    container_name: infordetection-rsshub
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://rsshub-redis:6379/
      PLAYWRIGHT_WS_ENDPOINT: ws://rsshub-browserless:3000
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN}
    depends_on:
      rsshub-redis:
        condition: service_healthy
      rsshub-browserless:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  rsshub-browserless:
    image: browserless/chrome:latest
    container_name: infordetection-rsshub-browserless
    restart: unless-stopped
    logging: *default-logging
    ulimits:
      core:
        hard: 0
        soft: 0

  rsshub-redis:
    image: redis:alpine
    container_name: infordetection-rsshub-redis
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - rsshub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s

  horizon:
    build:
      context: ./Horizon
    container_name: infordetection-horizon
    logging: *default-logging
    profiles:
      - manual
    volumes:
      - ./Horizon/src:/app/src:ro
      - ./Horizon/data:/app/data
      - ./Horizon/profiles:/app/profiles:ro
      - ./Horizon/topics:/app/topics:ro
      - ./Horizon/.env:/app/.env:ro
    environment:
      TZ: Asia/Shanghai
    depends_on:
      rsshub:
        condition: service_started
    command: ["--hours", "24"]

  horizon-api:
    build:
      context: ./Horizon
    container_name: infordetection-horizon-api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./Horizon/src:/app/src:ro
      - ./Horizon/data:/app/data
      - ./Horizon/profiles:/app/profiles:ro
      - ./Horizon/topics:/app/topics:ro
      - ./Horizon/.env:/app/.env:ro
      - ./output:/app/output
    environment:
      TZ: Asia/Shanghai
      HORIZON_API_HOST: 0.0.0.0
      HORIZON_API_PORT: 8080
      HORIZON_REPORT_OUTPUT_DIR: /app/output
      BROWSERLESS_SCREENSHOT_URL: http://rsshub-browserless:3000/screenshot
    depends_on:
      rsshub:
        condition: service_healthy
    entrypoint: ["uv", "run", "python", "-m", "src.n8n_api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  n8n:
    image: n8nio/n8n:latest
    container_name: infordetection-n8n
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "5678:5678"
    environment:
      TZ: Asia/Shanghai
      GENERIC_TIMEZONE: Asia/Shanghai
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/imports:ro
      - ./output:/files
    depends_on:
      horizon-api:
        condition: service_healthy

volumes:
  rsshub-redis-data:
  n8n-data:
